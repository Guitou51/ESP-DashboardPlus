name: PlatformIO Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        env: [esp32dev, esp32-s3, esp32-c3]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Install PlatformIO
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip check

      - name: Cache PlatformIO packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini', 'library.json', 'requirements-build.txt', 'constraints-build.txt', '.python-version') }}

      - name: Check HTML generation
        run: python -m unittest discover -s tests -v

      - name: Run pre-build script (generate header)
        run: python scripts/html_to_header_pio.py

      - name: Build (matrix env)
        run: python scripts/build.py -e ${{ matrix.env }} -v

      - name: Check native dashboard contracts
        run: python scripts/test_native.py --environment ${{ matrix.env }}

      - name: Install frontend test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check frontend behavior
        run: npm test
