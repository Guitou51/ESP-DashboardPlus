; PlatformIO Project Configuration File
;
; ESP32-DashboardPlus Library - Example Project
; 
; This configuration file is for building the example project.
; When using the library in your own project, you only need to
; add 'ESP-DashboardPlus' to your lib_deps.
;
; Build commands:
;   pio run              - Build the project
;   pio run -t upload    - Build and upload to ESP32
;   pio run -t monitor   - Open serial monitor

[platformio]
default_envs = esp32dev
src_dir = examples/basic
lib_dir = .

[env]
; Common settings for all environments
; This release also pins Arduino 3.3.12, ESP-IDF 5.5.5 and the toolchains.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Pre-build script to convert HTML to header
extra_scripts = 
    pre:scripts/html_to_header_pio.py

; Library dependencies
lib_deps = 
    bblanchon/ArduinoJson@7.4.3
    ESP32Async/ESPAsyncWebServer@3.12.1
    ESP32Async/AsyncTCP@3.5.0

; Check platform compatibility as well as framework compatibility.
; This excludes the web server's Raspberry Pi and ESP8266 dependencies.
lib_compat_mode = strict
lib_ignore = AsyncTCP_RP2040W

; Build flags
build_flags = 
    -DARDUINO_ARCH_ESP32
    -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev
board_build.partitions = default.csv

; Flash settings
board_upload.flash_size = 4MB
board_build.flash_mode = dio

[env:esp32-s3]
board = esp32-s3-devkitc-1
board_build.partitions = default.csv

[env:esp32-c3]
board = esp32-c3-devkitm-1
board_build.partitions = default.csv
